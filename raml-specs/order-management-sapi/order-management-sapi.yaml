#%RAML 1.0
title: Order Management System API
version: v1
baseUri: https://api.lmt.lv/sapi/order-management/v1
mediaType: application/json

/orders:
  post:
    displayName: Store Commercial Order
    description: Creates a new order record in the commercial order repository.
    body:
      application/json:
        properties:
          customerId: string
          offeringId: string
          amount: number
          currency: string
        example:
          customerId: "CUST-DB-99812"
          offeringId: "OFFERING_SWISS_CONNECT"
          amount: 19.99
          currency: "EUR"
    responses:
      201:
        body:
          application/json:
            example:
              orderId: "ORD-SYS-99812"
              status: "PENDING_PAYMENT"
              createdAt: "2026-08-04T10:01:00Z"

/orders/{orderId}/status:
  patch:
    displayName: Update Order Status
    description: Updates order state upon payment capture or activation completion.
    body:
      application/json:
        properties:
          status: string
          reason: string
        example:
          status: "COMPLETED"
          reason: "Payment verified and eSIM provisioned."
    responses:
      200:
        body:
          application/json:
            example:
              orderId: "ORD-SYS-99812"
              updatedStatus: "COMPLETED"